name: Feature Request
description: Suggest an idea or feature for Flisk Chat
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please fill out the sections below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Pitch
      description: Is your feature request related to a problem or a specific use case? Please describe.
      placeholder: A clear and concise description of the problem or opportunity...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Alternative
      description: Describe the solution you'd like or any alternative solutions/features you've considered.
      placeholder: A clear and concise description of what you want to happen...
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
