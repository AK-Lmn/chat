name: GEL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly, so the dashboard record never expires (artifacts last 30 days)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gel-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gel:
    permissions: { contents: read, checks: read, pull-requests: read }
    uses: flisk-sh/gel/.github/workflows/gel.yml@6a25d9698e613ae0c6b101bf5d01c2bf03bda123 # main (gel#69), reads the north-star branch
    with: { gel_ref: 6a25d9698e613ae0c6b101bf5d01c2bf03bda123 }
